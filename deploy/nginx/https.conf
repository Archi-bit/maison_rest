server {
    listen 443 ssl;
    server_name maison-rest.duckdns.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/maison-rest.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maison-rest.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/app.locations;
}
