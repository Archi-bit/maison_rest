upstream django {
    zone django 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/conf.d/acme.location;
    include /etc/nginx/conf.d/app.locations;
}

include /etc/nginx/tls.d/*.conf;
